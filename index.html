<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffe8cf" />
    <title>Lullaby — Handmade Scented Candles</title>

    <!--
      Everything below with data-seo-default is the fallback for the very
      first paint and for crawlers that don't run JavaScript (Facebook/
      Telegram/Twitter link-preview bots). react-helmet-async only APPENDS
      its own tags — it doesn't remove these — so App.jsx deletes every
      data-seo-default element in a one-time effect right after mount,
      leaving exactly one, route-correct copy of each tag for anything that
      does run JS. Keep this block in sync with src/components/Seo.jsx.
    -->
    <meta
      data-seo-default
      name="robots"
      content="index, follow" />
    <meta
      data-seo-default
      name="description"
      content="Hand-poured scented candles in hand-glazed ceramic vessels. Every Lullaby candle hides a packet of seeds inside — plant them when the candle is done and give the vessel a second life." />
    <link
      data-seo-default
      rel="canonical"
      href="https://andriipetrovskyi.github.io/lullaby_redesign/" />

    <meta data-seo-default property="og:type" content="website" />
    <meta data-seo-default property="og:site_name" content="Lullaby" />
    <meta data-seo-default property="og:title" content="Lullaby — Handmade Scented Candles" />
    <meta
      data-seo-default
      property="og:description"
      content="Hand-poured scented candles in hand-glazed ceramic vessels. Every Lullaby candle hides a packet of seeds inside — plant them when the candle is done and give the vessel a second life." />
    <meta
      data-seo-default
      property="og:url"
      content="https://andriipetrovskyi.github.io/lullaby_redesign/" />
    <meta
      data-seo-default
      property="og:image"
      content="https://api-production-38d4.up.railway.app/uploads/8d001142-743b-4f2c-aee0-e126d7d0127d/light-pink-1.jpg" />
    <meta data-seo-default name="twitter:card" content="summary_large_image" />

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: decodes the path that
      // public/404.html re-encoded into the query string, then hands off
      // to React Router before it mounts. No-op on hosts with real SPA
      // fallback (Netlify) since this URL shape never occurs there.
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Gotham Black — платний шрифт, недоступний через Google Fonts.
         Потрібно самостійно розмістити файли шрифту (@font-face) або підключити ліцензійне джерело.
         До того часу застосовується fallback sans-serif. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #ffe8cf;
      }

      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-loader-text {
        font-family: "Libre Caslon Text", Georgia, serif;
        font-style: italic;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 1;
        user-select: none;
      }

      .boot-loader-text--outline {
        color: transparent;
        -webkit-text-stroke: 1.5px #eb7c46;
        text-stroke: 1.5px #eb7c46;
      }

      .boot-loader-text--fill {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #eb7c46;
        clip-path: inset(0 100% 0 0);
        animation: boot-loader-fill 1.8s ease-in-out infinite alternate;
      }

      @keyframes boot-loader-fill {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0% 0 0);
        }
      }
    </style>
  </head>
  <body>
    <noscript>This site needs JavaScript enabled to work.</noscript>
    <div id="root">
      <div class="boot-loader" aria-hidden="true">
        <span class="boot-loader-text boot-loader-text--outline">Lullaby</span>
        <span class="boot-loader-text boot-loader-text--fill">Lullaby</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
