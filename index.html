<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Gotham Black — платний шрифт, недоступний через Google Fonts.
         Потрібно самостійно розмістити файли шрифту (@font-face) або підключити ліцензійне джерело.
         До того часу застосовується fallback sans-serif. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #ffe8cf;
      }

      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-loader-text {
        font-family: "Libre Caslon Text", Georgia, serif;
        font-style: italic;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 1;
        user-select: none;
      }

      .boot-loader-text--outline {
        color: transparent;
        -webkit-text-stroke: 1.5px #eb7c46;
        text-stroke: 1.5px #eb7c46;
      }

      .boot-loader-text--fill {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #eb7c46;
        clip-path: inset(0 100% 0 0);
        animation: boot-loader-fill 1.8s ease-in-out infinite alternate;
      }

      @keyframes boot-loader-fill {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0% 0 0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" aria-hidden="true">
        <span class="boot-loader-text boot-loader-text--outline">Lullaby</span>
        <span class="boot-loader-text boot-loader-text--fill">Lullaby</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
