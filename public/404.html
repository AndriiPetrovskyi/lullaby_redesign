<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lullaby</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: GH Pages has no server-side SPA
      // fallback, so a direct hit on a route like /products/sunwashed 404s
      // before React ever loads. This re-encodes the path into a query
      // string and redirects to index.html, which decodes it back
      // (see the matching script in index.html) before React Router mounts.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep the "/lullaby_redesign" repo segment

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
